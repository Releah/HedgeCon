name: Bug report
description: Report a reproducible problem with HedgeCon
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve HedgeCon. Remove hostnames, usernames, IP addresses, tokens, passwords, private keys, and other sensitive information from logs and screenshots.

  - type: input
    id: version
    attributes:
      label: HedgeCon version
      description: The version shown in HedgeCon or the release you downloaded.
      placeholder: "0.1.5"
    validations:
      required: true

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Kali Linux
        - Other Linux distribution
        - Other
    validations:
      required: true

  - type: input
    id: operating-system-version
    attributes:
      label: Operating system version
      placeholder: "Windows 11 24H2 or Ubuntu 26.04"
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Windows installer
        - Windows portable executable
        - Linux AppImage
        - Development build
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What went wrong, and what were you trying to do?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exact error text when safe to share.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Drag files here if useful. Remove all credentials and identifying infrastructure details first.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant SSH server, Git provider, authentication method, or other environment details without sharing secrets.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and identifying infrastructure details from this report.
          required: true
