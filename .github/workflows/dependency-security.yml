name: Dependency security

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/**
  push:
    branches:
      - main
      - experimental
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/**
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Block high or critical production vulnerabilities
        run: pnpm audit --prod --audit-level high

      - name: Report build-tool advisories
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Type-check application
        run: pnpm typecheck

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
