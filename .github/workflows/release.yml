name: Build desktop release

on:
  push:
    branches:
      - main
      - experimental
    paths:
      - package.json
      - build/release-notes.md

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Read release version
        id: version
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          release_tag="v${package_version}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists." >&2
            exit 1
          fi

      - name: Create hidden draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --draft --title "HedgeCon ${RELEASE_TAG}" --notes-file build/release-notes.md "${release_flags[@]}"
          else
            gh release create "${RELEASE_TAG}" --draft --target "${GITHUB_SHA}" --title "HedgeCon ${RELEASE_TAG}" --notes-file build/release-notes.md "${release_flags[@]}"
          fi

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Windows release
        run: pnpm release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Linux AppImage
        run: pnpm release:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Publish completed GitHub Release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          release_flags=()
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release edit "${RELEASE_TAG}" --draft=false --title "HedgeCon ${RELEASE_TAG}" --notes-file build/release-notes.md "${release_flags[@]}"
